name: Build APK v3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter create --platforms=android --org com.rifmasri3 --project-name rif_market .
      - run: rm -f test/widget_test.dart
      - run: sed -i 's/android:label="[^"]*"/android:label="الريف المصري - نسخة معدلة 3"/' android/app/src/main/AndroidManifest.xml
      - name: Android permissions (mic + internet + speech service)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries><application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter test test/logic_test.dart test/logic_v2_test.dart test/logic_v3_test.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rif-market-v3-apk
          path: build/app/outputs/flutter-apk/app-release.apk
